<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Inky EduQuest</title>
    
    <!-- PWA Primary Meta Tags -->
    <meta name="theme-color" content="#5D8CBB" />
    <meta name="description" content="Inky EduQuest — Platform latih tubi dan gamifikasi peperiksaan. Belajar dan bermain bersama Inky!" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

    <!-- iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Inky EduQuest" />

    <!-- Apply saved theme before paint, to avoid a light/dark flash on load -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('eduquest_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-cream-100 text-ink-900 antialiased selection:bg-mist-300 selection:text-ink-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Register PWA Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('[PWA] Service Worker registered:', reg.scope))
            .catch((err) => console.warn('[PWA] Service Worker registration failed:', err));
        });

        // Auto-reload once when a new service worker takes control, so a
        // deploy that's already live doesn't stay invisible to a tab that
        // was open before it shipped.
        let swRefreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (swRefreshing) return;
          swRefreshing = true;
          window.location.reload();
        });
      }
    </script>
  </body>
</html>
