<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" font-family="Arial,Helvetica,sans-serif"><title>Orbit planet terdekat dengan Matahari</title><rect width="400" height="260" rx="14" fill="#f8fafc"/>
<g fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4">
<circle cx="40" cy="130" r="60"/><circle cx="40" cy="130" r="110"/><circle cx="40" cy="130" r="160"/><circle cx="40" cy="130" r="210"/></g>
<circle cx="40" cy="130" r="28" fill="#fbbf24" stroke="#f59e0b" stroke-width="3"/>
<text x="40" y="134" font-size="11" font-weight="bold" fill="#78350f" text-anchor="middle">Matahari</text>
<g fill="#e0f2fe" stroke="#0369a1" stroke-width="2">
