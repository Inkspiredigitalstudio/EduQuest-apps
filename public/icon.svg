<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Outer Rounded Shield -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="url(#gold)" stroke-width="8" opacity="0.4"/>

  <!-- Islamic Star Badge Background -->
  <g transform="translate(256,220)">
    <polygon points="0,-120 35,-85 85,-85 85,-35 120,0 85,35 85,85 35,85 0,120 -35,85 -85,85 -85,35 -120,0 -85,-35 -85,-85 -35,-85" fill="url(#gold)" opacity="0.15"/>
  </g>

  <!-- Open Book / Quran Symbol -->
  <g transform="translate(256, 240)">
    <!-- Left Page -->
    <path d="M-10,30 Q-70,0 -130,20 L-130,-70 Q-70,-90 -10,-60 Z" fill="#ffffff" opacity="0.95"/>
    <!-- Right Page -->
    <path d="M10,30 Q70,0 130,20 L130,-70 Q70,-90 10,-60 Z" fill="#f8fafc" opacity="0.95"/>
    <!-- Book Spine -->
    <path d="M-10,30 L0,35 L10,30 L10,-60 L0,-55 L-10,-60 Z" fill="url(#emerald)"/>
  </g>

  <!-- Crescent & Star -->
  <g transform="translate(256, 120)">
    <path d="M -15,-25 A 30,30 0 1,0 25,20 A 24,24 0 1,1 -15,-25 Z" fill="url(#gold)"/>
    <polygon points="18,-15 22,-5 32,-5 24,2 27,12 18,6 9,12 12,2 4,-5 14,-5" fill="url(#gold)"/>
  </g>

  <!-- SPPI QUEST Text -->
  <text x="256" y="415" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="42" fill="#ffffff" text-anchor="middle" letter-spacing="4">SPPI QUEST</text>
  <text x="256" y="450" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="20" fill="#38bdf8" text-anchor="middle" letter-spacing="2">AKIDAH • FEKAH • AKHLAK</text>
</svg>
